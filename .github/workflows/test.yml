name: Curriculum regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the offline app and check curriculum generators
        run: |
          bash build.sh
          node tests/history.js
          node tests/notes-verbatim.js
          node tests/book.js
          node tests/voice.js
          node tests/ai.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check History controls, course packs, lesson plans and exports offline
        run: python tests/history.py
