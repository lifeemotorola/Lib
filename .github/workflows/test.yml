name: Curriculum regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the offline app and check curriculum generators
        run: |
          bash build.sh
          node tests/history.js
          node tests/notes-verbatim.js
          node tests/cover-kg.js
          node tests/toc.js
          node tests/book.js
          node tests/voice.js
          node tests/ai.js
          node tests/header-footer.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check History controls, course packs, lesson plans and exports offline
        run: |
          set +e
          python tests/history.py 2>&1 | tee /tmp/hist.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Mirror the traceback as a check annotation: the raw log endpoint
            # is not always reachable, and annotations always are.
            tail -n 25 /tmp/hist.log | tr -d '\r' | sed 's/%/%25/g' > /tmp/hist.msg
            echo "::error title=history.py failed::$(tr '\n' '|' < /tmp/hist.msg)"
          fi
          exit "$code"
